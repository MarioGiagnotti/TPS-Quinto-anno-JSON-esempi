
<html>
<head>
<title>Primo esempio con JSON e JavaScript: letterale semplice</title>
<script language="javascript" type="text/javascript">
var dato1 = {
  "nome" : "Mario",
  "cognome" : "Rossi"
}
var dato2 = {
  "nome" : "Giuseppe",
  "cognome" : "Verdi"
}
document.write("<h1>Primo esempio JSON e Javascript: letterale semplice<\/h1>");
document.write("<h3>nome =" + dato1.nome + "<\/h3>");
document.write("<h3>cognome =" + dato1.cognome + "<\/h3>");
document.write("<h3>nome =" + dato2.nome + "<\/h3>");
document.write("<h3>cognome =" + dato2.cognome + "<\/h3>");
</script>
</head>
<body>
</body>
</html>
